name: Identify Eclipse build 65 source
on:
  push:
    branches: [codex/restore-build65-forms-push]
    paths: [.github/workflows/inspect-build65-source.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - name: Compare known UI presence (IPA inspection authorized by owner)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          node - <<'NODE'
          (async () => {
            const query='query {builds{byId(buildId:"4bb4efa4-63d0-43db-9b1d-885f29745dab"){id app{id} projectMetadataFileUrl artifacts{applicationArchiveUrl}}}}';
            const r=await fetch('https://api.expo.dev/graphql',{method:'POST',headers:{'Content-Type':'application/json',authorization:'Bearer '+process.env.EXPO_TOKEN},body:JSON.stringify({query})});
            if(!r.ok)throw Error('EAS metadata unavailable');
            const b=await r.json();if(b.errors?.length)throw Error('EAS query failed');
            const build=b.data.builds.byId;
            if(build.app.id!=='42ebb6eb-62b1-4784-a483-831ae3c804f2')throw Error('Unexpected project');
            const metadata=await (await fetch(build.projectMetadataFileUrl)).json();
            if(!Array.isArray(metadata.archiveContent)||metadata.archiveContent.some(x=>typeof x!=='string'))throw Error('Unexpected metadata shape');
            const known=['components/SalesOfferForm.tsx','components/DiscountCodeField.tsx','app/(creator)/create-event.tsx','app/(tabs)/event/[id].tsx'];
            console.log('KNOWN_UI_FILES='+JSON.stringify(Object.fromEntries(known.map(p=>[p,metadata.archiveContent.some(x=>x===p||x.endsWith('/'+p))]))));
            const archive=await fetch(build.artifacts.applicationArchiveUrl);if(!archive.ok)throw Error('IPA unavailable');
            require('node:fs').writeFileSync(process.env.RUNNER_TEMP+'/eclipse65.ipa',Buffer.from(await archive.arrayBuffer()));
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
      - name: Compare fixed public interface labels in the embedded application
        run: |
          python3 - <<'PY'
          import zipfile, os, json
          with zipfile.ZipFile(os.environ['RUNNER_TEMP']+'/eclipse65.ipa') as archive:
              paths=[n for n in archive.namelist() if n.endswith('main.jsbundle')]
              if len(paths)!=1: raise RuntimeError('Expected one application bundle')
              bundle=archive.read(paths[0])
          labels=['Diseña el acceso.','ECLIPSE / VENTAS','Tipos de entrada','Nombre de la entrada','Configuración VIP','Catálogo de venta','Reservados de mesa','MESA COMPLETA','Añadir tipo de entrada','Añadir oferta','VIP / Reservado','Precio del reservado completo','Grupo VIP','Información básica']
          print('UI_LABEL_MATCHES='+json.dumps({label:(label.encode() in bundle or label.encode('utf-16le') in bundle) for label in labels},ensure_ascii=False))
          PY
      - name: Remove temporary IPA
        if: always()
        run: rm -f "$RUNNER_TEMP/eclipse65.ipa"
