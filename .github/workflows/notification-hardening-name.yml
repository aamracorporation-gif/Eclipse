name: Notification hardening migration name
on:
  push:
    branches: [codex/notifications-core-v2]
    paths: [.github/workflows/notification-hardening-name.yml]
permissions:
  contents: read
jobs:
  migration-name:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Name local migration without linking any database
        run: |
          npx --yes supabase@2.120.0 migration new --help
          npx --yes supabase@2.120.0 migration new notification_core_v2_hardening
          git ls-files --others --exclude-standard supabase/migrations
