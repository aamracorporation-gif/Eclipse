name: Staging candidate preflight
on:
  push:
    branches: [codex/staging-release-candidate-20261008]
    paths: [.github/workflows/staging-candidate-preflight.yml]
permissions:
  contents: read
concurrency:
  group: staging-candidate-preflight
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'aamracorporation-gif/Eclipse' && github.ref == 'refs/heads/codex/staging-release-candidate-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Report credential presence only
        id: access
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
        run: |
          node <<'NODE'
          const fs=require('fs');
          const report={commit:process.env.GITHUB_SHA,environment:'staging',capabilities:{}};
          for(const name of ['EXPO_TOKEN','SUPABASE_ACCESS_TOKEN','SUPABASE_DB_PASSWORD']) report.capabilities[name]=Boolean(process.env[name]);
          const ref=process.env.SUPABASE_STAGING_PROJECT_REF;
          report.stagingProjectRef=ref ? (ref==='uhondxttdpvywvkyqlkk'?'matches':'mismatch') : 'not_set';
          fs.writeFileSync('staging-candidate-preflight.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`expo_available=${!!process.env.EXPO_TOKEN}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## Staging candidate access\n```json\n'+JSON.stringify(report,null,2)+'\n```\nNo credentials displayed, no sends, no deployment and no build queued.\n');
          NODE
      - name: Verify existing Expo authentication
        if: steps.access.outputs.expo_available == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: '1'
        run: npx --yes eas-cli@18.0.1 whoami --non-interactive
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-candidate-preflight
          path: staging-candidate-preflight.json
          retention-days: 7
