name: EAS release build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build (all + testflight builds iOS TestFlight and Android APK together)
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - ios
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options:
          - preview
          - testflight
          - production

concurrency:
  group: eas-${{ inputs.profile }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.profile == 'production' && 'production' || 'staging' }}
    permissions:
      contents: read
    env:
      BUILD_PLATFORM: ${{ inputs.platform }}
      BUILD_PROFILE: ${{ inputs.profile }}
    steps:
      - name: Validate selected build target
        run: |
          case "$BUILD_PLATFORM" in all|android|ios) ;; *) exit 1 ;; esac
          case "$BUILD_PROFILE" in preview|testflight|production) ;; *) exit 1 ;; esac
          if [ "$BUILD_PROFILE" = testflight ] && [ "$BUILD_PLATFORM" = android ]; then
            echo '::error::Select ios or all for the TestFlight profile.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
      - name: Validate release environment guards
        run: node --test scripts/tests/buildEnvironment.test.cjs scripts/tests/stagingServices.test.cjs
      - name: Validate Expo dependency alignment
        run: npx expo install --check
      - name: Run release gates
        run: npm run ci:check
      - name: Backend and dependency security gates
        run: |
          npm --prefix backend ci
          npm --prefix backend audit --omit=dev --audit-level=critical
          node --test scripts/tests/dependencySecurity.test.cjs
          npm --prefix backend test
      - name: Configure EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 18.0.1
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Queue signed build
        run: |
          mkdir -p build-receipts
          git rev-parse HEAD > build-receipts/source-commit.txt
          if [ "$BUILD_PROFILE" = testflight ] && [ "$BUILD_PLATFORM" = all ]; then
            eas build --platform ios --profile testflight --non-interactive --no-wait --json > build-receipts/ios.json
            eas build --platform android --profile preview --non-interactive --no-wait --json > build-receipts/android.json
          else
            eas build --platform "$BUILD_PLATFORM" --profile "$BUILD_PROFILE" --non-interactive --no-wait --json > build-receipts/builds.json
          fi
      - name: Preserve build identifiers and source commit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-receipts-${{ github.sha }}
          path: build-receipts/
          if-no-files-found: ignore
      - name: Record build scope
        run: |
          echo 'Builds queued. Verify both are FINISHED and match the recorded source commit and intended environment before acceptance. This does not confirm installation, QA or store submission.' >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: $GITHUB_SHA; profile: $BUILD_PROFILE; platform: $BUILD_PLATFORM" >> "$GITHUB_STEP_SUMMARY"
          if [ "$BUILD_PROFILE" = testflight ] && [ "$BUILD_PLATFORM" = all ]; then
            echo 'Pair: iOS TestFlight + Android preview APK, both staging, from this same commit.' >> "$GITHUB_STEP_SUMMARY"
          fi
