name: Inspect TestFlight build 64
on:
  push:
    branches: [codex/testflight64-status-20261006]
    paths: [.github/workflows/inspect-testflight64.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'aamracorporation-gif/Eclipse' && github.ref == 'refs/heads/codex/testflight64-status-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: app.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read build metadata only
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo 'EAS_STATUS_BLOCKED: EXPO_TOKEN is not available to the staging workflow.'
            echo 'EAS build 64 could not be inspected: EXPO_TOKEN missing.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          work="$(mktemp -d "$RUNNER_TEMP/eclipse-eas-readonly.XXXXXX")"
          cp app.json "$work/app.json"
          cd "$work"
          # Static app.json only: do not load application code or build hooks.
          npx --yes eas-cli@18.0.1 build:list --platform ios --app-build-version 64 --limit 10 --json --non-interactive > builds.json
          node <<'NODE'
          const fs = require('node:fs');
          const builds = JSON.parse(fs.readFileSync('builds.json', 'utf8'));
          if (!Array.isArray(builds)) throw new Error('Unexpected EAS build-list response.');
          const summary = builds.map(build => ({
            id: build.id,
            status: build.status,
            appVersion: build.appVersion,
            appBuildVersion: build.appBuildVersion,
            platform: build.platform,
            distribution: build.distribution,
            buildProfile: build.buildProfile,
            gitCommitHash: build.gitCommitHash,
            createdAt: build.createdAt,
            completedAt: build.completedAt,
            hasApplicationArchive: Boolean(build.artifacts?.applicationArchiveUrl || build.artifacts?.buildUrl),
          }));
          console.log('EAS_BUILD_64_METADATA=' + JSON.stringify(summary));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Read-only EAS build 64 metadata (not an Apple submission confirmation):\n\n```json\n' + JSON.stringify(summary, null, 2) + '\n```\n');
          NODE
          rm -f builds.json
