name: Persist validated TestFlight fixes

# One-shot persistence of the exact files whose tests passed in run 37521140097.
# That run's final commit guard rejected tracked node_modules changes from npm ci.
# This job runs no package lifecycle scripts and commits only three verified files.
on:
  push:
    branches: [codex/testflight-ci-audit-20261006]
    paths: [.github/workflows/repair-testflight-dependencies.yml]
permissions:
  contents: read
concurrency:
  group: testflight-dependency-repair
  cancel-in-progress: false
jobs:
  persist-reviewed-artifact:
    if: github.repository == 'aamracorporation-gif/Eclipse' && github.ref == 'refs/heads/codex/testflight-ci-audit-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Require the tested source commit as the direct parent
        run: test "$(git rev-parse HEAD^)" = '916b49aa02584245da1f39a419883c4b2e740654'
      - uses: actions/download-artifact@v4
        with:
          name: testflight-dependency-candidate
          run-id: 37521140097
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/validated-testflight-artifact
      - name: Verify provenance and copy only the reviewed files
        run: |
          python3 <<'PY'
          import hashlib, os, pathlib, shutil
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'validated-testflight-artifact'
          expected = {
              'package-lock.json': '417bf9950df8b1fe632b76a2607f2e39229cb39c111950769b56ddeea929cac0',
              'backend/package-lock.json': '7f5e268a790bbc28b5d3a3f375009189e3afb169707009b95c109409803c2281',
              'supabase/functions/apple-wallet-generator/bundledAssets.ts': '9a3177339c35fa4cd6099a9d40eb32aff4d68c6992fed98094a6e1529855c1f4',
          }
          paths = list(root.rglob('*'))
          assert not any(p.is_symlink() for p in paths), 'Unexpected artifact symlink'
          assert {str(p.relative_to(root)) for p in paths if p.is_file()} == set(expected), 'Unexpected artifact file set'
          for name, digest in expected.items():
              source = root / name
              assert hashlib.sha256(source.read_bytes()).hexdigest() == digest, 'Artifact integrity mismatch: ' + name
              shutil.copyfile(source, pathlib.Path(os.environ['GITHUB_WORKSPACE']) / name)
              print('Verified exact tested file:', name)
          PY
      - name: Commit only the verified repair files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          unexpected="$(git diff --name-only | grep -Ev '^(package-lock\.json|backend/package-lock\.json|supabase/functions/apple-wallet-generator/bundledAssets\.ts)$' || true)"
          test -z "$unexpected"
          git add -- package-lock.json backend/package-lock.json supabase/functions/apple-wallet-generator/bundledAssets.ts
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(release): commit validated dependency locks and current Wallet artwork'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          git rev-parse HEAD
