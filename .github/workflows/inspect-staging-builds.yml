name: Inspect Eclipse staging builds
on:
  push:
    branches: [codex/build-staging-candidate-55487308]
    paths: [.github/workflows/inspect-staging-builds.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read exact EAS build and submission states
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          (async () => {
            const query = `query CandidateSnapshot($android: ID!, $ios: ID!) {
              builds {
                android: byId(buildId: $android) {
                  id status platform buildProfile gitCommitHash appVersion appBuildVersion createdAt completedAt
                  initialQueuePosition queuePosition estimatedWaitTimeLeftSeconds priority
                  metrics { buildWaitTime buildQueueTime buildDuration }
                  artifacts { applicationArchiveUrl buildUrl }
                  error { errorCode message }
                }
                ios: byId(buildId: $ios) {
                  id status platform buildProfile gitCommitHash appVersion appBuildVersion
                  submissions { id status platform iosConfig { ascAppIdentifier } error { errorCode message } }
                }
              }
            }`;
            const res = await fetch('https://api.expo.dev/graphql', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', authorization: 'Bearer ' + process.env.EXPO_TOKEN },
              body: JSON.stringify({ query, variables: {
                android: '83e1bc6b-b294-4a39-a287-b511f148e699',
                ios: '9b2dc61b-d8f2-4cce-b01e-a7b107c1806d'
              } })
            });
            if (!res.ok) throw new Error('EAS query HTTP ' + res.status);
            const body = await res.json();
            if (body.errors?.length) throw new Error(body.errors.map(e => e.message).join('; '));
            const states = body.data.builds;
            for (const [platform, build] of Object.entries(states)) {
              if (build.gitCommitHash !== '55487308c9327eace83c7c5fc7b1afdf66ec566d') throw new Error('Unexpected source commit');
              if (build.buildProfile !== (platform === 'ios' ? 'testflight' : 'preview')) throw new Error('Unexpected build profile');
            }
            console.log(JSON.stringify(states));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, JSON.stringify(states, null, 2) + '\n');
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
