name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate aligned lockfile artifact
        run: npm install --package-lock-only --ignore-scripts
      - name: Upload aligned lockfile
        uses: actions/upload-artifact@v4
        with:
          name: expo-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - run: npm ci
      - name: Validate Expo dependency alignment
        run: npx expo install --check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --runInBand
      - name: Validate Expo web bundle
        run: npm run build:web
      - name: Backend dependencies and tests
        working-directory: backend
        run: npm ci && npm test

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
