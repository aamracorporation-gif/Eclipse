# One-off submission of the existing Eclipse iOS 1.0.0 (65) binary.
# No build job, version increment, OTA update, production deployment or App Review.
# Uses the project's existing Expo GitHub connection and stored Apple credentials.
name: Submit Eclipse iOS build 65 to TestFlight

on:
  push:
    branches:
      - codex/submit-testflight-65-20261006
    paths:
      - .eas/workflows/submit-testflight-65.yml

jobs:
  find_build_65:
    name: Find the exact completed iOS store build 65
    type: get-build
    params:
      platform: ios
      app_identifier: com.achraf.eclipse
      app_version: '1.0.0'
      app_build_version: '65'
      distribution: store
      simulator: false
      wait_for_in_progress: false

  missing_build_65:
    name: Stop if build 65 is not ready
    needs: [find_build_65]
    if: ${{ !needs.find_build_65.outputs.build_id }}
    steps:
      - name: Fail without compiling or selecting a different version
        run: |
          echo 'No completed Eclipse iOS 1.0.0 (65) store build was found. Nothing was submitted and no new build was created.' >&2
          exit 1

  submit_build_65:
    name: Upload only Eclipse iOS build 65 to TestFlight
    needs: [find_build_65]
    if: ${{ needs.find_build_65.outputs.build_id && needs.find_build_65.outputs.app_build_version == '65' && needs.find_build_65.outputs.app_identifier == 'com.achraf.eclipse' }}
    type: testflight
    environment: preview
    env:
      ECLIPSE_BUILD_ENV: staging
    params:
      build_id: ${{ needs.find_build_65.outputs.build_id }}
      profile: testflight
      submit_beta_review: false
