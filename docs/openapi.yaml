openapi: 3.0.3
info:
  title: Eclipse API
  version: 1.0.0
  description: |
    Especificación mínima (manual) de endpoints críticos del backend/edge functions.
servers:
  - url: https://{projectRef}.supabase.co
    variables:
      projectRef:
        default: your-project-ref
paths:
  /functions/v1/event-share:
    post:
      summary: Crea o convierte enlaces de compartición de eventos
      description: |
        Endpoint multipropósito. Enviar `action=create` para generar/reutilizar token, o `action=convert` para registrar conversiones.
        Requiere JWT de sesión (Supabase) en Authorization: Bearer <token>.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string, enum: [create, convert] }
                eventId: { type: string, format: uuid }
                token: { type: string, format: uuid }
                kind: { type: string, default: open }
      responses:
        "200": { description: OK }
        "401": { description: JWT inválido o faltante }
        "403": { description: Sin permisos (p. ej. evento privado) }
        "404": { description: Recurso no encontrado }
        "410": { description: Enlace o evento expirado/cancelado }
  /functions/v1/event-share/resolve:
    get:
      summary: Resuelve un token de compartición a un evento (público)
      description: No requiere JWT. Retorna metadatos mínimos y enlaces deep link/web.
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: eventId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200": { description: OK }
        "403": { description: Evento privado }
        "404": { description: Enlace no encontrado }
        "410": { description: Enlace o evento expirado/cancelado }
  /functions/v1/event-share/evento/{token}:
    get:
      summary: HTML puente para abrir el evento desde navegador
      description: Devuelve HTML con deep link a la app y fallback a la tienda.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: HTML }
        "400": { description: Token faltante/ inválido }
        "404": { description: Enlace no encontrado }
        "410": { description: Enlace o evento expirado/cancelado }
  /functions/v1/dispatch-notifications:
    post:
      summary: Procesa la cola de notificaciones (push/email/sms)
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  minimum: 1
                  maximum: 500
                  default: 50
      responses:
        "200":
          description: Resultado por canal
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  push: { type: object }
                  email: { type: object }
                  sms: { type: object }
  /functions/v1/ticket-calendar:
    get:
      summary: Descarga un archivo .ics para añadir el evento al calendario
      parameters:
        - name: ticket_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ICS
          content:
            text/calendar:
              schema:
                type: string
        "400": { description: Parámetros inválidos }
        "403": { description: Token inválido }
        "404": { description: Ticket o evento no encontrado }
  /stripe/webhook:
    post:
      summary: Stripe webhook (payment intents, account updates, refund updates and failures)
      description: Requiere body raw y Stripe-Signature.
      responses:
        "200": { description: Acknowledge }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
